# CI del backend (CLICKCLACK-9): compila y ejecuta toda la suite contra un Postgres con PostGIS real.
# Solo corre cuando cambia backend/ (ver Docs/tecnica/pipeline-ci.md).
name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas del backend (Java 21 y Postgres con PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: clickclak
          POSTGRES_USER: clickclak
          POSTGRES_PASSWORD: clickclak
        # El perfil dev del backend apunta a localhost:5434 (ver application-dev.yml).
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U clickclak -d clickclak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvnw se versionó sin permiso de ejecución: se invoca con sh.
      - name: Ejecutar las pruebas
        run: sh ./mvnw -B -ntp test

      - name: Resumen de resultados
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          filas, total = [], [0, 0, 0, 0]
          for ruta in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              r = ET.parse(ruta).getroot()
              v = [int(r.get(k)) for k in ("tests", "failures", "errors", "skipped")]
              total = [a + b for a, b in zip(total, v)]
              filas.append((r.get("name").split(".")[-1], *v))
          print("### Pruebas del backend\n")
          print("| Clase | Pruebas | Fallos | Errores | Omitidas |\n|---|---|---|---|---|")
          for f in filas:
              print("| %s | %d | %d | %d | %d |" % f)
          print("| **Total (%d clases)** | **%d** | **%d** | **%d** | **%d** |" % (len(filas), *total))
          PY

      - name: Conservar los informes de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: informes-surefire
          path: backend/target/surefire-reports
          retention-days: 14
