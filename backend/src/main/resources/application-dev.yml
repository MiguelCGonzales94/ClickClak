spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/clickclak
    username: clickclak
    password: clickclak
  jpa:
    show-sql: true
  flyway:
    # Además del esquema, en desarrollo se carga la semilla (administrador de pruebas).
    # El perfil prod no lo hace: usa solo classpath:db/migration (ver application.yml).
    locations: classpath:db/migration,classpath:db/dev

clickclak:
  seguridad:
    jwt:
      # Secreto de DESARROLLO únicamente — nunca usar este valor fuera de esta máquina.
      secret: "clickclak-desarrollo-clave-hmac-no-usar-en-produccion-cambiar-siempre"
