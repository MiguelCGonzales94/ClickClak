spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

clickclak:
  seguridad:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      # Vacío por defecto: el proxy sirve frontends y API bajo el mismo origen, así que no se
      # autoriza ningún origen externo. Solo se rellena si algún día hay un cliente en otro dominio.
      origenes: ${CORS_ORIGENES:}
